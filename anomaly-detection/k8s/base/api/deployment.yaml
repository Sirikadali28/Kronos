apiVersion: apps/v1
kind: Deployment

metadata:
  name: kronos-api
  namespace: kronos

  labels:
    app: kronos-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kronos-api

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: kronos-api

    spec:
      containers:
        - name: api

          image: anomaly-detection-api:latest

          imagePullPolicy: Never

          ports:
            - containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kronos-secret
                  key: database-url

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: kronos-config
                  key: REDIS_URL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 30
            periodSeconds: 10