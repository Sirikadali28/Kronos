name: KRONOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: anomaly-detection

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: anomaly-detection/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff Lint
        run: |
          ruff check app

      - name: Black Formatting
        run: |
          black --check .

      - name: Mypy Type Checking
        run: |
          mypy app

      - name: Run Unit Tests
        run: |
          pytest -v

      - name: Check Python Syntax
        run: |
          python -m compileall app

      - name: Verify Imports
        run: |
          python -c "from app.main import app; print('Application loaded successfully')"

      - name: Build Docker Image
        run: |
          docker build -t kronos-api:${{ github.sha }} .

      - name: Verify Docker Image
        run: |
          docker images | grep kronos-api