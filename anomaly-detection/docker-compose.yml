services:
  postgres:
    image: postgres:17
    container_name: kronos-postgres
    restart: always
    environment:
      POSTGRES_DB: kronos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 22601Siri
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kronos-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: kronos-api
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    restart: always

  celery-worker:
    build: .
    container_name: kronos-worker
    command: celery -A app.workers.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
      - postgres
    env_file:
      - .env.docker
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: kronos-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api

  grafana:
    image: grafana/grafana:latest
    container_name: kronos-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: